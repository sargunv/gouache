[workspace]
resolver = "3"
members = ["demo"]

# The demo ships as a small wasm module.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1

# The demo's development build: an unoptimized map is too slow to use.
[profile.dev-opt]
inherits = "dev"
opt-level = 2
debug = "line-tables-only"
