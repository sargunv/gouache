name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build the style
        # The site's own URL, over HTTPS: Pages reports http:// for a custom
        # domain that doesn't enforce HTTPS, and pages served over HTTPS can't
        # load from it.
        run: GOUACHE_BASE_URL="https://${BASE_URL#*://}/" mise run build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Build the demo
        run: demo/build.sh --release
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
